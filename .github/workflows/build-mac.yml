name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check local modules
        run: |
          missing=0
          for f in main.py viewer.py xmp_manager.py platform_utils.py filters.py \
                   settings.py settings_dialog.py thumb_cache.py exif_info.py version.py \
                   requirements.txt FotoSito-mac.spec; do
            if [ ! -f "$f" ]; then echo "НЕТ ФАЙЛА: $f"; missing=1; fi
          done
          for d in assets exiftool_mac .github; do
            if [ ! -d "$d" ]; then echo "НЕТ ПАПКИ: $d"; missing=1; fi
          done
          if [ ! -f exiftool_mac/lib/Image/ExifTool.pm ]; then
            echo "НЕТ ФАЙЛА: exiftool_mac/lib/Image/ExifTool.pm"; missing=1
          fi
          exit $missing

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check ExifTool
        run: |
          chmod +x exiftool_mac/exiftool
          perl exiftool_mac/exiftool -ver

      - name: Make icon.icns if missing
        run: |
          python - <<'EOF'
          import os
          from PIL import Image
          if not os.path.exists("assets/icon.icns"):
              for name in ("assets/icon.ico", "assets/logo.png"):
                  if os.path.exists(name):
                      img = Image.open(name).convert("RGBA")
                      img = img.resize((512, 512))
                      img.save("assets/icon.icns")
                      print("icon from", name)
                      break
          EOF

      - name: Build app
        run: pyinstaller --noconfirm FotoSito-mac.spec

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --keepParent FotoSito.app ../FotoSito-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FotoSito-${{ matrix.arch }}
          path: FotoSito-${{ matrix.arch }}.zip